<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Link builder</title>
    <link rel="stylesheet" href="builder.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-main">
        <h1>Link builder</h1>
        <p class="page-subtitle">
          Edit Custom section links in links.json format. Changes save to extension
          storage and appear in the popup after reload or when the popup is open.
        </p>
      </div>
      <div class="page-header-actions">
        <button id="new-link-btn" type="button">New link</button>
        <button id="export-custom-btn" type="button" class="secondary">Export</button>
        <button id="import-toggle-btn" type="button" class="secondary">Import</button>
      </div>
    </header>

    <div id="message" class="message hidden" role="status"></div>

    <section id="import-panel" class="import-panel hidden" aria-label="Import links">
      <label class="field">
        <span class="field-label">Import JSON</span>
        <textarea
          id="link-import-json"
          rows="4"
          placeholder='Paste a link node, array, or { "Custom": { "children": [...] } }'
          spellcheck="false"
        ></textarea>
      </label>
      <div class="import-actions">
        <button id="link-import-btn" type="button">Import into Custom</button>
        <button id="import-cancel-btn" type="button" class="secondary">Cancel</button>
      </div>
    </section>

    <main class="layout">
      <section class="panel links-panel" aria-label="Custom links">
        <div class="panel-header">
          <h2>Custom links</h2>
          <span id="link-count" class="panel-meta"></span>
        </div>
        <div id="links-list" class="links-list"></div>
      </section>

      <section class="panel editor-panel" aria-label="Link editor">
        <div class="panel-header">
          <h2 id="editor-title">New link</h2>
        </div>
        <form id="link-form" class="link-form">
          <input id="link-edit-id" type="hidden" value="" />
          <label class="field">
            <span class="field-label">Type</span>
            <select id="link-type">
              <option value="scriptlet">Scriptlet (Run)</option>
              <option value="navigate">Navigate (Open)</option>
              <option value="derived-url">Derived URL</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Name</span>
            <input id="link-name" type="text" required autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">Display name (optional)</span>
            <input id="link-display-name" type="text" autocomplete="off" />
          </label>
          <label class="field" id="link-code-field">
            <span class="field-label">Script</span>
            <textarea id="link-code" rows="5" spellcheck="false"></textarea>
          </label>
          <label class="field is-hidden" id="link-path-field">
            <span class="field-label">Path</span>
            <input id="link-path" type="text" spellcheck="false" />
          </label>
          <label class="field is-hidden" id="link-url-field">
            <span class="field-label">URL template</span>
            <input id="link-url" type="text" spellcheck="false" />
          </label>
          <label class="field is-hidden" id="link-nav-field">
            <span class="field-label">Navigation</span>
            <select id="link-nav"></select>
          </label>
          <label class="field" id="host-pattern-field">
            <span class="field-label">Host pattern</span>
            <select id="host-pattern-mode">
              <option value="inherit">Inherit from section</option>
              <option value="none">None (active tab)</option>
              <option value="custom">Custom regex</option>
            </select>
          </label>
          <label class="field is-hidden" id="host-pattern-custom-field">
            <span class="field-label">Custom host pattern</span>
            <input
              id="host-pattern-custom"
              type="text"
              placeholder="e.g. \.service-now\.com$"
              spellcheck="false"
            />
          </label>
          <label class="field" id="search-tags-field">
            <span class="field-label">Search tags (optional)</span>
            <input id="link-search-tags" type="text" placeholder="comma, separated" />
          </label>

          <section id="parameters-section" class="field-group">
            <label class="field">
              <span class="field-label">Parameters</span>
              <select id="parameter-mode">
                <option value="none">None</option>
                <option value="single">Single parameter</option>
                <option value="multiple">Multiple parameters</option>
              </select>
            </label>
            <div id="single-parameter-fields" class="parameter-panel is-hidden">
              <div class="builder-row">
                <input data-field="param-name" type="text" placeholder="name" />
                <input data-field="param-placeholder" type="text" placeholder="placeholder" />
                <input data-field="param-default" type="text" placeholder="default" />
              </div>
              <div class="builder-row">
                <label class="inline-check">
                  <input data-field="param-optional" type="checkbox" />
                  Optional
                </label>
                <input
                  data-field="param-choices"
                  type="text"
                  placeholder="choices, comma, separated"
                />
              </div>
            </div>
            <div id="multiple-parameters-panel" class="parameter-panel is-hidden">
              <div id="multiple-parameters-list" class="builder-list"></div>
              <button id="add-parameter-btn" type="button" class="secondary row-add">
                Add parameter
              </button>
            </div>
          </section>

          <section id="extract-section" class="field-group is-hidden">
            <div class="field-group-header">
              <span class="field-label">Extract rules</span>
              <button id="add-extract-btn" type="button" class="secondary row-add">
                Add extract rule
              </button>
            </div>
            <div id="extract-list" class="builder-list"></div>
          </section>

          <div class="form-actions">
            <button id="save-link-btn" type="submit">Save</button>
            <button id="delete-link-btn" type="button" class="danger secondary" disabled>
              Delete
            </button>
            <button id="clear-form-btn" type="button" class="secondary">Reset</button>
          </div>
        </form>
      </section>
    </main>

    <script src="../lib/storage-keys.js"></script>
    <script src="../lib/link-catalog.js"></script>
    <script src="../lib/link-model.js"></script>
    <script src="../lib/ui-message.js"></script>
    <script type="module" src="builder.js"></script>
  </body>
</html>
