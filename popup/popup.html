<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ServiceNow Links</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1>SN Links</h1>
        <button id="network-rules-btn" type="button" class="header-btn">
          Network rules
        </button>
      </div>
      <div class="header-meta">
        <p id="instance-status" class="instance-status"></p>
        <div class="header-toggles">
          <label
            id="inject-on-load-enabled-label"
            class="header-toggle"
            title="When off, no on-load scriptlets run (per-link checkboxes are ignored)"
          >
            <input id="inject-on-load-enabled" type="checkbox" checked />
            On load
          </label>
          <label
            id="network-hooks-enabled-label"
            class="header-toggle"
            title="When off, network rules and fetch/XHR hooks do not run"
          >
            <input id="network-hooks-enabled" type="checkbox" checked />
            Network
          </label>
          <label
            id="csp-disable-label"
            class="csp-disable-label"
            title="Strip CSP response headers for this tab on reload"
          >
            <input id="csp-disable-checkbox" type="checkbox" />
            Disable CSP
          </label>
        </div>
      </div>
    </header>
    <div id="message" class="message hidden" role="status"></div>
    <nav
      id="section-tabs"
      class="section-tabs"
      role="tablist"
      aria-label="Link sections"
    ></nav>
    <div id="links" class="links" role="tabpanel"></div>
    <section class="add-script is-collapsed" aria-label="Add custom script">
      <button
        id="add-script-toggle"
        type="button"
        class="add-script-toggle"
        aria-expanded="false"
        aria-controls="add-script-panel"
      >
        Add action
      </button>
      <div id="add-script-panel" class="add-script-panel" hidden>
        <label class="field">
          <span class="field-label">Name</span>
          <input
            id="script-name"
            type="text"
            placeholder="Optional label"
            autocomplete="off"
          />
        </label>
        <label class="field">
          <span class="field-label">Script</span>
          <textarea
            id="script-code"
            rows="4"
            placeholder="Paste JavaScript or a javascript: bookmarklet. Use {value} for an input."
            spellcheck="false"
          ></textarea>
        </label>
        <button id="add-script-btn" type="button">Add action</button>
      </div>
    </section>
    <div
      id="search-overlay"
      class="search-overlay hidden"
      aria-hidden="true"
    >
      <input
        id="search-input"
        type="text"
        class="search-input"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search links"
      />
    </div>
    <div
      id="resize-handle"
      class="resize-handle"
      role="separator"
      aria-label="Resize popup"
      tabindex="-1"
    ></div>
    <script src="../lib/navigation-shared.js"></script>
    <script src="../lib/link-model.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
