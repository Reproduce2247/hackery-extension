<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ServiceNow Links</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>SN Links</h1>
      <p id="instance-status" class="instance-status"></p>
    </header>
    <div id="message" class="message hidden" role="status"></div>
    <nav
      id="section-tabs"
      class="section-tabs"
      role="tablist"
      aria-label="Link sections"
    ></nav>
    <div id="links" class="links" role="tabpanel"></div>
    <section class="add-script is-collapsed" aria-label="Add custom script">
      <button
        id="add-script-toggle"
        type="button"
        class="add-script-toggle"
        aria-expanded="false"
        aria-controls="add-script-panel"
      >
        Add action
      </button>
      <div id="add-script-panel" class="add-script-panel" hidden>
        <label class="field">
          <span class="field-label">Name</span>
          <input
            id="script-name"
            type="text"
            placeholder="Optional label"
            autocomplete="off"
          />
        </label>
        <label class="field">
          <span class="field-label">Script</span>
          <textarea
            id="script-code"
            rows="4"
            placeholder="Paste JavaScript or a javascript: bookmarklet. Use {value} for an input."
            spellcheck="false"
          ></textarea>
        </label>
        <button id="add-script-btn" type="button">Add action</button>
      </div>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
